<style>
        body {
            background-color: #ffffff;
            font-family: 'Hanken Grotesk', sans-serif;
            overflow-x: hidden;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        .pill-tag {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .active-pill {
            background-color: #0F172A;
            color: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 4px 6px rgba(0,0,0,0.1);
        }

        .inactive-pill {
            background-color: #F4F6F8;
            color: #0F172A;
        }

        .primary-btn {
            background: linear-gradient(135deg, #2EBD85 0%, #1AA870 100%);
            box-shadow: 0 12px 24px rgba(46, 189, 133, 0.25);
            transition: all 0.2s ease;
        }

        .primary-btn:hover {
            box-shadow: 0 16px 32px rgba(46, 189, 133, 0.35);
            transform: translateY(-1px);
        }

        .primary-btn:active {
            transform: translateY(2px);
            box-shadow: 0 6px 12px rgba(46, 189, 133, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Micro-interactions */
        .step-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e0e3e5;
            transition: all 0.3s ease;
        }
        .step-indicator.active {
            width: 24px;
            border-radius: 4px;
            background-color: #006c48;
        }
    </style>

<script>
        function toggleTag(el) {
            if (el.classList.contains('inactive-pill')) {
                el.classList.remove('inactive-pill');
                el.classList.add('active-pill');
            } else {
                el.classList.remove('active-pill');
                el.classList.add('inactive-pill');
            }
            
            // Add a little pop effect
            el.style.transform = 'scale(0.95)';
            setTimeout(() => {
                el.style.transform = 'scale(1)';
            }, 100);
        }

        // Atmospheric subtle mouse parallax on the glass card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-container');
            if(!card) return;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const xPercent = (x / rect.width - 0.5) * 10;
            const yPercent = (y / rect.height - 0.5) * 10;
            
            card.style.transform = `perspective(1000px) rotateX(${-yPercent}deg) rotateY(${xPercent}deg)`;
        });
    </script>
