<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "error": "#ba1a1a",
                        "primary": "#006c48",
                        "on-surface": "#191c1e",
                        "background": "#f7f9fb",
                        "outline": "#6d7a71",
                        "secondary-container": "#7efaba",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#77fbbd",
                        "surface-dim": "#d8dadc",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "surface-bright": "#f7f9fb",
                        "surface-variant": "#e0e3e5",
                        "surface": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#dae2fd",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#9fa7c0",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-fixed": "#7efaba",
                        "primary-fixed-dim": "#57dea3",
                        "on-secondary-fixed-variant": "#005233",
                        "secondary": "#006c46",
                        "on-background": "#191c1e",
                        "tertiary": "#565e74",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#002113",
                        "on-primary-fixed-variant": "#005235",
                        "secondary-fixed-dim": "#60dda0",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary-fixed": "#002112",
                        "inverse-primary": "#57dea3",
                        "on-primary-container": "#00462d",
                        "on-surface-variant": "#3d4a42",
                        "surface-tint": "#006c48",
                        "outline-variant": "#bccabf",
                        "tertiary-fixed-dim": "#bec6e0",
                        "on-error": "#ffffff",
                        "primary-container": "#2ebd85",
                        "surface-container-low": "#f2f4f6",
                        "inverse-surface": "#2d3133",
                        "surface-container": "#eceef0",
                        "on-secondary-container": "#00734a",
                        "on-tertiary-fixed": "#131b2e",
                        "on-tertiary-container": "#353c51",
                        "night-blue": "#0F172A",
                        "earth-brown": "#321400"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "squircle": "32px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-margin": "24px",
                        "gutter": "16px",
                        "glass-padding": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"],
                        "display-lg-mobile": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .glass-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }
        .primary-gradient-btn {
            background: linear-gradient(135deg, #2EBD85 0%, #1AA870 100%);
            box-shadow: 0 12px 24px rgba(46, 189, 133, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .primary-gradient-btn:hover {
            box-shadow: 0 16px 32px rgba(46, 189, 133, 0.35);
            transform: translateY(-1px);
        }
        .primary-gradient-btn:active {
            transform: translateY(2px);
            box-shadow: 0 4px 12px rgba(46, 189, 133, 0.2);
        }
        .input-focus-effect:focus {
            border-color: #2EBD85;
            background-color: rgba(255, 255, 255, 0.9);
            outline: none;
            box-shadow: 0 0 0 4px rgba(46, 189, 133, 0.1);
        }
        .squircle-radius {
            border-radius: 32px;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col font-body-md text-on-surface antialiased overflow-x-hidden">
<!-- Top Navigation Anchor -->
<header class="w-full top-0 sticky bg-background flex justify-center items-center px-6 py-4 z-50">
<div class="flex items-center justify-between w-full max-w-5xl">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">close</button>
</div>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg font-bold text-primary tracking-tight">TiketIO</h1>
<div class="w-8"></div> <!-- Spacer for center alignment -->
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-12 relative">
<!-- Progress Indicator -->
<div class="mb-12 flex items-center space-x-3 opacity-60">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-high"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant ml-2">PASO 1 DE 3</span>
</div>
<!-- Main Glassmorphic Container -->
<div class="glass-container squircle-radius p-glass-padding w-full max-w-lg flex flex-col items-center text-center">
<!-- Icon Decoration from Prompt Reference -->
<div class="mb-8 relative w-24 h-24 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-inner overflow-hidden">
<span class="material-symbols-outlined text-primary text-5xl opacity-40">location_on</span>
<div class="absolute inset-0 bg-gradient-to-tr from-primary-container/10 to-transparent"></div>
</div>
<h2 class="font-headline-md text-headline-md text-night-blue mb-2">Ubicación</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-10 max-w-xs">
                Por favor, introduce tu código postal para encontrar los mejores eventos cerca de ti.
            </p>
<!-- Pill-shaped Input Field -->
<div class="w-full max-w-sm">
<label class="sr-only" for="zipcode">Código Postal</label>
<div class="relative group">
<span class="absolute left-6 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline transition-colors group-focus-within:text-primary">pin_drop</span>
<input class="w-full h-14 pl-14 pr-6 bg-white/50 border border-earth-brown rounded-full font-label-md text-night-blue placeholder:text-outline-variant input-focus-effect transition-all" id="zipcode" placeholder="Código Postal (CP)" type="text">
</div>
<p class="text-left mt-3 ml-6 font-label-sm text-label-sm text-outline-variant">Ejemplo: 28001</p>
</div>
</div>
<!-- CTA Action -->
<div class="mt-12 flex flex-col items-center w-full max-w-lg">
<button class="primary-gradient-btn w-full max-w-sm h-16 rounded-full flex items-center justify-center gap-3 text-white font-headline-sm text-headline-sm px-8">
                Siguiente
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="mt-8 font-label-md text-label-md text-on-surface-variant">
                ¿Necesitas ayuda? <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4" href="#">Contáctanos</a>
</p>
</div>
<!-- Atmospheric Background Elements (Subtle Blurs) -->
<div class="fixed top-1/4 -right-20 w-80 h-80 bg-primary/5 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-1/4 -left-20 w-80 h-80 bg-secondary-container/10 rounded-full blur-[100px] -z-10"></div>
</main>
<!-- Bottom Navigation suppressed per Destination Rule (Focused journey) -->
<script>
        // Micro-interaction for input field
        const input = document.getElementById('zipcode');
        input.addEventListener('input', (e) => {
            // Remove non-numeric characters
            e.target.value = e.target.value.replace(/\D/g, '').substring(0, 5);
        });

        // Button interaction logic
        const nextBtn = document.querySelector('.primary-gradient-btn');
        nextBtn.addEventListener('click', () => {
            if(input.value.length < 5) {
                input.classList.add('border-error');
                input.classList.remove('border-earth-brown');
                setTimeout(() => {
                    input.classList.remove('border-error');
                    input.classList.add('border-earth-brown');
                }, 1000);
            } else {
                nextBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Validando...';
                setTimeout(() => {
                    nextBtn.innerHTML = 'Listo <span class="material-symbols-outlined">check_circle</span>';
                }, 1500);
            }
        });
    </script>
</body></html>
